# Enable console over USB
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# DMA-driven RX for the CC1352 UART (SERCOM has no RX FIFO)
CONFIG_DMA=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_SAM0_ASYNC=y
CONFIG_UART_SAM0_ASYNC_RX_CONTINUOUS=y
# The CC1352 UART uses async (DMA) RX and interrupt-driven TX at the same
# time; the default exclusive mode would drop the TX callback.
CONFIG_UART_EXCLUSIVE_API_CALLBACKS=n
CONFIG_UART_LINE_CTRL=y

# Use only the new USB device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_GPIO=y
CONFIG_REBOOT=y

# Use native SX126x driver
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
# Keep radio in standby (not deep sleep); avoids a BUSY wakeup deadlock on first lora_config()
CONFIG_LORA_SX126X_NATIVE_SLEEP=n

# Enable unique serial number from chip ID
CONFIG_HWINFO=y

# Disable logging and console for production (enable via debug.conf)
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Stack sizes balanced for 16KB SAMD21 RAM
CONFIG_ISR_STACK_SIZE=768
CONFIG_USBD_MSG_SLAB_COUNT=4
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# USB product strings
CONFIG_SAMPLE_USBD_PID=0xBABB
CONFIG_SAMPLE_USBD_PRODUCT="Catsniffer"
CONFIG_SAMPLE_USBD_MANUFACTURER="Electronic Cats"

# Stack headroom reporting in 'status' (no RAM cost) and crash log
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
