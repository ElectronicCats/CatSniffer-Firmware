# Debug fragment: west build -b catsniffer_v2 -- -DEXTRA_CONF_FILE=debug.conf
# Output goes to Segger RTT over SWD (PA30/PA31); the USB ports stay as in
# production. Logging does not fit in 16 KB SRAM alongside the app, so it
# is left off; printk and the thread analyzer are available.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=256
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# Trade bridge buffering for the debug tooling
CONFIG_CATSNIFFER_BRIDGE_RING_SIZE=256
