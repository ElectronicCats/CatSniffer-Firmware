manifest:
  version: "1.2"

  # Minimal manifest for CI builds of the SAMD21 (CatSniffer v1/v2) firmware.
  # The Zephyr fork branch carries the native SX126x driver and the SAM0
  # UART/DMA changes this firmware depends on (see SAMD21/zephyr-patches).
  # Module revisions match the fork's west.yml at that branch.

  remotes:
    - name: wero1414
      url-base: https://github.com/wero1414
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: wero1414
      revision: sx1262-rssi
      west-commands: scripts/west-commands.yml
    - name: hal_atmel
      remote: zephyrproject
      revision: 8cd575049f04131e333558072484bfc6334c19c4
      path: modules/hal/atmel
    - name: cmsis
      remote: zephyrproject
      revision: 512cc7e895e8491696b61f7ba8066b4a182569b8
      path: modules/hal/cmsis
    - name: cmsis_6
      remote: zephyrproject
      revision: 30a859f44ef8ab4dc8f84b03ed586fd16ccf9d74
      path: modules/hal/cmsis_6
    - name: loramac-node
      remote: zephyrproject
      revision: fb00b383072518c918e2258b0916c996f2d4eebe
      path: modules/lib/loramac-node

  self:
    path: SAMD21/catsniffer
