name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  lint:
    name: Pre-commit (clang/yaml/whitespace)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  build-rpi-pico:
    name: Build (rpi_pico)
    runs-on: ubuntu-22.04
    needs: lint
    container:
      image: ghcr.io/zephyrproject-rtos/ci:latest

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /work
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.3.0 /work/zephyrproject
          cd /work/zephyrproject
          west update
          west zephyr-export
          pip3 install -r zephyr/scripts/requirements.txt

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd /work/zephyrproject
          west build -s "${GITHUB_WORKSPACE}" -b rpi_pico -d "${GITHUB_WORKSPACE}/build/rpi_pico" -- \
            -DUSER_CACHE_DIR="${GITHUB_WORKSPACE}/.cache/zephyr"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catsniffer-rpi-pico-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/rpi_pico/zephyr/zephyr.uf2
            build/rpi_pico/zephyr/zephyr.hex
            build/rpi_pico/zephyr/zephyr.elf
