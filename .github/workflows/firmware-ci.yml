name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  lint:
    name: Pre-commit (clang/yaml/whitespace)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  build-rpi-pico:
    name: Build (rpi_pico)
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install west
          cd "${GITHUB_WORKSPACE}"
          if [[ ! -d .west ]]; then
            west init -l RP2040/catsniffer --mf west.yml
          fi
          west update
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          west build -s RP2040/catsniffer \
            -b rpi_pico \
            -d "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico" -- \
            -DUSER_CACHE_DIR="${GITHUB_WORKSPACE}/RP2040/catsniffer/.cache/zephyr"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catsniffer-rpi-pico-${{ github.sha }}
          if-no-files-found: error
          path: |
            RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.uf2
            RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.hex
            RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.elf
