name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  lint:
    name: Pre-commit (clang/yaml/whitespace)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  build-rpi-pico:
    name: Build (rpi_pico)
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y ninja-build cmake device-tree-compiler gperf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zephyr SDK (ARM toolchain only)
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz \
               -O /tmp/zephyr-sdk-minimal.tar.xz
          tar xf /tmp/zephyr-sdk-minimal.tar.xz -C $HOME
          $HOME/zephyr-sdk-0.16.8/setup.sh -t arm-zephyr-eabi -h

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install west jsonschema pyelftools PyYAML
          west init -l RP2040/catsniffer --mf west-ci.yml
          cd "${GITHUB_WORKSPACE}/RP2040"
          west update

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/RP2040/zephyr"
          export ZEPHYR_SDK_INSTALL_DIR="${HOME}/zephyr-sdk-0.16.8"
          cd "${GITHUB_WORKSPACE}/RP2040"
          west build -s catsniffer \
            -b rpi_pico \
            -d "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico" -- \
            -DUSER_CACHE_DIR="${GITHUB_WORKSPACE}/RP2040/catsniffer/.cache/zephyr"

      - name: Rename build artifacts
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          mkdir -p ci-artifacts
          cp RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.uf2 ci-artifacts/catsniffer-${SHORT_SHA}.uf2
          cp RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.hex ci-artifacts/catsniffer-${SHORT_SHA}.hex
          cp RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.elf ci-artifacts/catsniffer-${SHORT_SHA}.elf

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catsniffer-rpi-pico-${{ github.sha }}
          if-no-files-found: error
          path: ci-artifacts/
