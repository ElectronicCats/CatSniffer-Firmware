name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  lint:
    name: Pre-commit (clang/yaml/whitespace)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  build-rpi-pico:
    name: Build (rpi_pico)
    runs-on: ubuntu-22.04
    needs: lint
    container:
      image: ghcr.io/zephyrproject-rtos/ci:latest

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/zephyrproject"
          python3 -m venv "${HOME}/zephyrproject/.venv"
          source "${HOME}/zephyrproject/.venv/bin/activate"
          pip install --upgrade pip
          pip install west
          west init -m https://github.com/wero1414/zephyr --mr fsk-native-driver "${HOME}/zephyrproject"
          cd "${HOME}/zephyrproject"
          west update
          west zephyr-export
          pip3 install -r zephyr/scripts/requirements.txt

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/RP2040/catsniffer"
          bash scripts/catsniffer_build_flash_test.sh -c

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catsniffer-rpi-pico-${{ github.sha }}
          if-no-files-found: error
          path: |
            RP2040/catsniffer/build/zephyr/zephyr.uf2
            RP2040/catsniffer/build/zephyr/zephyr.hex
            RP2040/catsniffer/build/zephyr/zephyr.elf
