name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish (example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            rel="${{ github.event.inputs.release_tag }}"
          else
            rel="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${rel}" >> "${GITHUB_OUTPUT}"
          echo "CATSNIFFER_FW_VERSION=${rel}" >> "${GITHUB_ENV}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install west
          cd "${GITHUB_WORKSPACE}"
          if [[ -d RP2040/.west ]]; then
            WEST_WS="${GITHUB_WORKSPACE}/RP2040"
          elif [[ -d .west ]]; then
            WEST_WS="${GITHUB_WORKSPACE}"
          else
            west init -l RP2040/catsniffer --mf west.yml
            WEST_WS="${GITHUB_WORKSPACE}/RP2040"
          fi
          cd "${WEST_WS}"
          west topdir
          west update --fetch-opt="--depth=1" hal_rpi_pico cmsis
          west zephyr-export
          pip install -r zephyr/scripts/requirements-build-test.txt

      - name: Install Zephyr SDK (ARM toolchain only)
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="0.16.8"
          SDK_MIN="zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/${SDK_MIN}" \
               -O "/tmp/${SDK_MIN}"
          tar xf "/tmp/${SDK_MIN}" -C "${HOME}"
          "${HOME}/zephyr-sdk-${SDK_VERSION}/setup.sh" -t arm-zephyr-eabi -h -c

      - name: Build release firmware
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE}/RP2040/.west" ]]; then
            WEST_WS="${GITHUB_WORKSPACE}/RP2040"
            APP_SRC="catsniffer"
          else
            WEST_WS="${GITHUB_WORKSPACE}"
            APP_SRC="RP2040/catsniffer"
          fi
          cd "${WEST_WS}"
          west build -s "${APP_SRC}" \
            -b rpi_pico \
            -d "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico" -- \
            -DUSER_CACHE_DIR="${GITHUB_WORKSPACE}/RP2040/catsniffer/.cache/zephyr" \
            -DCATSNIFFER_FW_VERSION="${CATSNIFFER_FW_VERSION}"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/release-assets"
          cp "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.uf2" \
             "${GITHUB_WORKSPACE}/release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.uf2"
          cp "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.hex" \
             "${GITHUB_WORKSPACE}/release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.hex"
          cp "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.elf" \
             "${GITHUB_WORKSPACE}/release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.elf"
          sha256sum "${GITHUB_WORKSPACE}/release-assets/"* > \
            "${GITHUB_WORKSPACE}/release-assets/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.uf2
            release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.hex
            release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.elf
            release-assets/SHA256SUMS.txt
