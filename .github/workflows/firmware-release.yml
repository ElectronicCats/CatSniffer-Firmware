name: Firmware Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to publish (example: v3.1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            rel="${{ github.event.inputs.release_tag }}"
          else
            rel="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${rel}" >> "${GITHUB_OUTPUT}"
          echo "CATSNIFFER_FW_VERSION=${rel}" >> "${GITHUB_ENV}"

      - name: Install system dependencies
        run: sudo apt-get install -y ninja-build cmake device-tree-compiler gperf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zephyr SDK (ARM toolchain only)
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz \
               -O /tmp/zephyr-sdk-minimal.tar.xz
          tar xf /tmp/zephyr-sdk-minimal.tar.xz -C $HOME
          $HOME/zephyr-sdk-0.16.8/setup.sh -t arm-zephyr-eabi -h

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install west jsonschema pyelftools PyYAML
          west init -l RP2040/catsniffer --mf west-ci.yml
          cd "${GITHUB_WORKSPACE}/RP2040"
          west update

      - name: Build release firmware (RP2040)
        shell: bash
        run: |
          set -euo pipefail
          export ZEPHYR_BASE="${GITHUB_WORKSPACE}/RP2040/zephyr"
          export ZEPHYR_SDK_INSTALL_DIR="${HOME}/zephyr-sdk-0.16.8"
          cd "${GITHUB_WORKSPACE}/RP2040"
          west build -s catsniffer \
            -b rpi_pico \
            -d "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico" -- \
            -DUSER_CACHE_DIR="${GITHUB_WORKSPACE}/RP2040/catsniffer/.cache/zephyr" \
            -DCATSNIFFER_FW_VERSION="${CATSNIFFER_FW_VERSION}"

      - name: Collect CC1352 HEX assets
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          python3 tools/get_hex_files.py

      - name: Filter unsupported CC1352 example HEX files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE}/tmp" ]]; then
            find "${GITHUB_WORKSPACE}/tmp" -type f \( -iname "simple_central*.hex" -o -iname "simple_peripheral*.hex" \) -delete
          fi

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/release-assets"

          cp "${GITHUB_WORKSPACE}/RP2040/catsniffer/build/rpi_pico/zephyr/zephyr.uf2" \
             "${GITHUB_WORKSPACE}/release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.uf2"

          if [[ -f "${GITHUB_WORKSPACE}/board_release.json" ]]; then
            cp "${GITHUB_WORKSPACE}/board_release.json" "${GITHUB_WORKSPACE}/release-assets/board_release.json"
          fi

          if [[ -d "${GITHUB_WORKSPACE}/tmp" ]]; then
            cp "${GITHUB_WORKSPACE}/tmp/"*.hex "${GITHUB_WORKSPACE}/release-assets/" || true
          fi

          sha256sum "${GITHUB_WORKSPACE}/release-assets/"* > \
            "${GITHUB_WORKSPACE}/release-assets/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/catsniffer-${{ steps.version.outputs.release_tag }}.uf2
            release-assets/board_release.json
            release-assets/*.hex
            release-assets/SHA256SUMS.txt

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/tmp" || true
          rm -f "${GITHUB_WORKSPACE}/board_release.json" || true
